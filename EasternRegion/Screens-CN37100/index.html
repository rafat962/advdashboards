<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة معلومات شاشات العقد الأول — المنطقة الشرقية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--n0:#030915;--n1:#061129;--n2:#0a1a3f;--gold:#d4a853;--gl:#f0d48e;--gd:#9f7430;--ink:#eef2fa;--ink2:#c3cce0;--muted:#94a3c4;
 --line:rgba(212,168,83,.28);--hair:rgba(255,255,255,.08);--teal:#3fc1c9;--green:#4fd18b;--amber:#f0bf5a;--red:#ff6b5e;--violet:#b38cff;--blue:#5aa9ff;
 --r:16px;--glass:linear-gradient(160deg,rgba(16,40,92,.55),rgba(6,17,41,.8))}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Cairo',system-ui,sans-serif;color:var(--ink);font-size:14px;line-height:1.7;min-height:100vh;background:radial-gradient(1000px 600px at 80% -10%,rgba(36,84,196,.2),transparent 65%),linear-gradient(180deg,var(--n1),var(--n0) 60%);background-color:var(--n0)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(90,169,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(90,169,255,.035) 1px,transparent 1px);background-size:56px 56px;-webkit-mask:radial-gradient(ellipse at 50% 20%,#000 30%,transparent 80%);mask:radial-gradient(ellipse at 50% 20%,#000 30%,transparent 80%)}
.gold-text{background:linear-gradient(180deg,#fff0c4,var(--gold) 60%,var(--gd));-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{font-family:'JetBrains Mono',monospace;direction:ltr;unicode-bidi:isolate}
header{position:relative;padding:18px 0 18px;border-bottom:1px solid var(--hair);background:linear-gradient(180deg,rgba(3,9,21,.6),transparent)}
header::after{content:"";position:absolute;inset:auto 0 -1px 0;height:1px;background:linear-gradient(90deg,transparent 5%,rgba(240,212,142,.6) 50%,transparent 95%)}
.hw{max-width:1500px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brandrow{display:flex;align-items:center;gap:12px}.brandrow img{height:30px}.brandrow .sep{width:1px;height:28px;background:linear-gradient(180deg,transparent,var(--gold),transparent)}
h1{margin:0;font-size:26px;font-weight:900}
.hsub{color:var(--ink2);font-size:13.5px;margin-top:2px}
.layout{max-width:1500px;margin:0 auto;padding:18px 24px 40px;display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start;position:relative;z-index:1}
/* nav */
nav{position:sticky;top:12px;background:var(--glass);border:1px solid var(--hair);border-radius:var(--r);padding:10px;max-height:calc(100vh - 24px);overflow:auto}
nav .home{display:flex;align-items:center;gap:8px;width:100%;font:800 14px 'Cairo';color:var(--gl);background:rgba(212,168,83,.08);border:1px solid var(--line);border-radius:11px;padding:9px 12px;cursor:pointer;margin-bottom:8px;text-align:right}
nav .home.on{background:linear-gradient(180deg,var(--gl),var(--gold));color:#1a1405}
nav h6{margin:12px 6px 6px;font-size:12px;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:6px}
nav h6::after{content:"";flex:1;height:1px;background:var(--hair)}
nav button.it{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:right;background:transparent;border:1px solid transparent;border-radius:10px;padding:7px 10px;color:var(--ink2);cursor:pointer;font:600 13px 'Cairo';transition:.15s;margin-bottom:2px}
nav button.it small{font:500 11px 'JetBrains Mono',monospace;color:var(--muted);direction:ltr}
nav button.it:hover{background:rgba(255,255,255,.04);border-color:var(--hair)}
nav button.it.on{background:rgba(212,168,83,.12);border-color:var(--line);color:#fff}
nav button.it .dt{display:flex;align-items:center;gap:7px;width:100%}
nav button.it .dt i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
/* main */
.card{background:var(--glass);border:1px solid var(--hair);border-radius:var(--r);box-shadow:0 16px 36px rgba(0,0,0,.3);overflow:hidden;margin-bottom:14px}
.card h3{margin:0;padding:13px 18px;font-size:15.5px;font-weight:800;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative}
.card h3::after{content:"";position:absolute;bottom:-1px;right:18px;width:46px;height:2px;background:linear-gradient(270deg,var(--gold),transparent)}
.card h3 small{font-weight:600;color:var(--muted);font-size:12px}
.pad{padding:16px 18px}
.hero{padding:20px 22px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(270deg,var(--gold),transparent)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--gl);padding:3px 12px;border:1px solid var(--line);border-radius:20px;background:rgba(212,168,83,.07)}
.hero h2{margin:10px 0 4px;font-size:27px;font-weight:900;line-height:1.35}
.hero .full{color:var(--ink2);font-size:14.5px;margin:0}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.badge{background:rgba(3,9,21,.55);border:1px solid var(--hair);padding:5px 13px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.badge b{color:var(--gl);font-weight:700}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:3px 11px;border-radius:999px;border:1px solid;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.s-done{color:#7ee5aa;border-color:rgba(79,209,139,.4);background:rgba(79,209,139,.1)}
.s-prog{color:#8fc8ff;border-color:rgba(90,169,255,.4);background:rgba(90,169,255,.1)}
.s-follow{color:var(--gl);border-color:var(--line);background:rgba(212,168,83,.1)}
.s-plan{color:#c8b4ff;border-color:rgba(179,140,255,.4);background:rgba(179,140,255,.1)}
.s-wait{color:#ffd88a;border-color:rgba(240,191,90,.4);background:rgba(240,191,90,.1)}
.s-hold{color:#ffb3ab;border-color:rgba(255,107,94,.4);background:rgba(255,107,94,.1)}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.ib{background:rgba(3,9,21,.45);border:1px solid var(--hair);border-radius:12px;padding:11px 14px}
.ib .k{font-size:12px;color:var(--muted);font-weight:600}
.ib .v{font-size:17px;font-weight:800;color:#fff;margin-top:2px;font-feature-settings:"tnum"}
.ib .h{font-size:11.5px;color:var(--gl);margin-top:1px}
.ib .n{font-size:11.5px;color:#ffd88a;margin-top:3px}
.ib .n::before{content:"⚠ "}
.prog{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center;position:relative}
.ring::after{content:"";position:absolute;inset:12px;border-radius:50%;background:#081633}
.ring span{position:relative;z-index:1;font-size:24px;font-weight:900;font-feature-settings:"tnum"}
.ring small{display:block;font-size:11px;color:var(--muted);text-align:center;font-weight:600;margin-top:-6px}
.bars .row{margin-bottom:12px}
.bars .lb{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:5px}
.bars .lb b{color:#fff;font-feature-settings:"tnum"}
.track{height:12px;border-radius:7px;background:rgba(255,255,255,.07);overflow:hidden;border:1px solid var(--hair)}
.track span{display:block;height:100%;border-radius:7px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:#0d1d47;color:var(--gl);font-weight:800;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--hair);color:var(--ink2);font-feature-settings:"tnum"}
tfoot td{color:#fff;font-weight:800;background:rgba(212,168,83,.07)}
.tnote{font-size:12px;color:var(--muted);padding:10px 14px}
.steps{list-style:none;margin:0;padding:6px 18px 14px;counter-reset:s}
.steps li{position:relative;padding:12px 52px 12px 0;border-bottom:1px dashed var(--hair);counter-increment:s}
.steps li:last-child{border:0}
.steps li::before{content:counter(s);position:absolute;right:0;top:12px;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:16px;color:var(--c,var(--gl));background:color-mix(in srgb,var(--c,var(--gold)) 14%,transparent);border:1px solid color-mix(in srgb,var(--c,var(--gold)) 45%,transparent)}
.steps li::after{content:"";position:absolute;right:17px;top:50px;bottom:-12px;width:2px;background:linear-gradient(var(--hair),transparent)}
.steps li:last-child::after{display:none}
.steps .t{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:14.5px;color:#fff}
.steps .d{color:var(--ink2);font-size:13.5px;margin-top:2px}
.target{display:flex;align-items:center;gap:10px;margin:0 18px 16px;padding:10px 14px;border-radius:12px;background:rgba(212,168,83,.08);border:1px solid var(--line);font-size:13.5px}
.target b{color:var(--gl);font-size:15px}
.goal{margin:0 18px 16px;padding:10px 14px;border-radius:12px;background:rgba(79,209,139,.07);border:1px solid rgba(79,209,139,.3);font-size:13.5px;color:#bff0d3}
ul.bl{margin:0;padding:14px 18px 14px 18px;list-style:none}
ul.bl li{position:relative;padding:6px 20px 6px 0;color:var(--ink2)}
ul.bl li::before{content:"";position:absolute;right:2px;top:15px;width:8px;height:8px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
.next{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;margin:0 18px 16px;border-radius:12px;background:linear-gradient(90deg,rgba(90,169,255,.12),transparent);border:1px solid rgba(90,169,255,.35)}
.next b{color:#8fc8ff;white-space:nowrap}
.warn{margin:0 18px 16px;padding:12px 14px;border-radius:12px;background:rgba(255,107,94,.08);border:1px solid rgba(255,107,94,.35);color:#ffc9c3;font-size:13px}
.warn b{color:#ff8a7e}
.stg{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:14px 18px}
.stg div{background:rgba(3,9,21,.45);border:1px solid var(--hair);border-radius:12px;padding:10px;position:relative}
.stg div b{display:block;font-size:13px;color:#fff}
.stg div span{font-size:11.5px;color:var(--muted);line-height:1.5;display:block;margin-top:3px}
.stg div i{font-style:normal;position:absolute;left:10px;top:8px;font-weight:900;color:var(--gold);opacity:.6}
.stg div:first-child{border-color:var(--line);background:rgba(212,168,83,.07)}
.stg div:last-child{border-color:rgba(255,107,94,.35)}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 18px}
.mo{background:rgba(3,9,21,.45);border:1px solid var(--hair);border-radius:12px;padding:12px}
.mo .m{font-weight:800;color:#fff;font-size:13.5px}
.mo .c{font-size:26px;font-weight:900;color:var(--gl);font-feature-settings:"tnum";line-height:1.2;margin-top:4px}
.mo .c small{font-size:12px;color:var(--muted);font-weight:600}
.mo .a{font-size:12px;color:var(--ink2)}
.mo .track{margin-top:8px;height:8px}
.fk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 18px 0}
.imp{display:flex;align-items:center;gap:14px;margin:12px 18px 16px;padding:12px 16px;border-radius:12px;background:linear-gradient(90deg,rgba(79,209,139,.12),transparent);border:1px solid rgba(79,209,139,.35)}
.imp .v{font-size:22px;font-weight:900;color:#7ee5aa;font-feature-settings:"tnum"}
.imp .k{color:var(--ink2);font-size:13px}
.links{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px}
.links a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:800 13.5px 'Cairo';color:#1a1405;background:linear-gradient(180deg,var(--gl),var(--gold));border-radius:11px;padding:9px 16px;box-shadow:0 8px 20px rgba(212,168,83,.25)}
.links a.sec{background:rgba(3,9,21,.55);color:var(--gl);border:1px solid var(--line);box-shadow:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.empty{padding:40px 18px;text-align:center;color:var(--muted)}
.specs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 18px 14px}
.src{font-size:11.5px;color:var(--muted);text-align:left;margin-top:-4px;margin-bottom:10px}
tbody tr.go{cursor:pointer}tbody tr.go:hover{background:rgba(212,168,83,.07)}
footer{margin-top:10px;padding:16px;color:var(--muted);font-size:12.5px;text-align:center;border-top:1px solid var(--hair)}
footer b{color:var(--gl)}
#main{min-width:0;animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(212,168,83,.3);border-radius:10px}
@media(max-width:1100px){.layout{grid-template-columns:1fr}nav{position:static;max-height:none}.stg{grid-template-columns:repeat(2,1fr)}.two,.fk{grid-template-columns:1fr}.months{grid-template-columns:repeat(2,1fr)}.specs{grid-template-columns:repeat(2,1fr)}}
body.single nav{display:none}
body.single .layout{grid-template-columns:1fr;max-width:1300px}
@media print{nav,header .brandrow{display:none}.layout{grid-template-columns:1fr}}
</style>
</head>

 impacts:[['ترحيل عقود مكة المكرمة',29000000,'ABAM-30011'],['ترحيل عقود الدمام',85000000,'CN46-41'],['ترحيل عقد مكة — الأراضي البيضاء',761250,'PROJ-30326'],['ترحيل عقد الرياض الثالث',8250000,'866304'],['التعويض المستهدف لعقد جدة — يونيبول',25750000,'CN-135274']]
};

const $=s=>document.querySelector(s);
const ST={done:'مكتمل',prog:'جارٍ',follow:'قيد المتابعة',plan:'مخطط',wait:'بانتظار',hold:'متوقف / معلّق'};
const SC={done:'#4fd18b',prog:'#5aa9ff',follow:'#d4a853',plan:'#b38cff',wait:'#f0bf5a',hold:'#ff6b5e'};
const fmt=n=>n.toLocaleString('en-US');
const mr=n=>(n/1e6).toLocaleString('en-US',{maximumFractionDigits:2})+' مليون ريال';
const chip=(k,txt)=>`<span class="st s-${k}">${txt||ST[k]}</span>`;
const regAr=id=>REGIONS.find(r=>r.id===id).ar;
const valOf=c=>{const v=(c.info||[]).find(x=>x[0]==='قيمة العقد');return v?+v[1].replace(/[^\d]/g,''):0;};
const inIframe=(()=>{try{return window.self!==window.top}catch(e){return true}})();

function nav(cur){
  let h=`<button class="home${cur==='portfolio'?' on':''}" data-id="portfolio">▦ نظرة عامة على المحفظة</button>`;
  REGIONS.forEach(r=>{
    const list=C.filter(c=>c.region===r.id); if(!list.length) return;
    h+=`<h6>${r.ar} · ${list.length}</h6>`+list.map(c=>`<button class="it${c.id===cur?' on':''}" data-id="${c.id}"><span class="dt"><i style="background:${SC[c.status[1]]}"></i>${c.short}</span><small>${c.no}</small></button>`).join('');
  });
  $('#nav').innerHTML=h;
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.id));
}
function infoGrid(c){
  return `<div class="igrid">`+[['رقم العقد',c.no],['الجهة المتعاقدة',c.party],...c.info].map(x=>`<div class="ib"><div class="k">${x[0]}</div><div class="v${/^رقم/.test(x[0])?' mono':''}">${x[1]}</div>${x[2]?(/عرض المجلس|خطاب/.test(x[2])?`<div class="n">${x[2]}</div>`:`<div class="h">${x[2]}</div>`):''}</div>`).join('')+`</div>`;
}
function stepsCard(s){
  const items=s.items.map(it=>`<li style="--c:${SC[it[2]]}"><div class="t">${it[0]} ${chip(it[2])}</div><div class="d">${it[1]}</div></li>`).join('');
  const cnt={};s.items.forEach(i=>cnt[i[2]]=(cnt[i[2]]||0)+1);
  const sum=Object.entries(cnt).map(([k,v])=>`${ST[k]} ${v}`).join(' · ');
  return `<div class="card"><h3>${s.title}<small>${s.items.length} إجراءات · ${sum}</small></h3><ol class="steps">${items}</ol>
   ${s.goal?`<div class="goal">🎯 الهدف: ${s.goal}</div>`:''}
   ${s.target?`<div class="target">⏱ ${s.targetLbl}: <b class="mono">${s.target}</b></div>`:''}</div>`;
}
function table(t){
  return `<div style="overflow:auto"><table><thead><tr>${t.h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${t.r.map(r=>`<tr>${r.map((x,i)=>`<td>${i?(typeof x==='number'?fmt(x):x):'<b style="color:#fff">'+x+'</b>'}</td>`).join('')}</tr>`).join('')}</tbody>${t.f?`<tfoot><tr>${t.f.map(x=>`<td>${typeof x==='number'?fmt(x):x}</td>`).join('')}</tr></tfoot>`:''}</table></div>`;
}
function contract(c){
  const scr=c.screens?SCREENS:null;
  const now=c.now||(scr&&scr.now), steps=c.steps||(scr&&scr.steps), next=scr&&scr.next;
  let h=`<div class="card hero"><span class="eyebrow">${regAr(c.region)} · ${c.no!=='—'?'عقد رقم <b class="mono" style="margin-inline-start:4px">'+c.no+'</b>':'عقد بدون رقم مسجّل'}</span>
    <h2>${c.short} ${chip(c.status[1],c.status[0])}</h2><p class="full">${c.name}</p>
    <div class="badges"><span class="badge">الجهة <b>${c.party}</b></span>${(c.info||[]).filter(x=>/^(قيمة العقد|الأجرة السنوية|تاريخ الاستلام)$/.test(x[0])).map(x=>`<span class="badge">${x[0]} <b>${x[1]}</b></span>`).join('')}</div></div>`;
  h+=`<div class="card"><h3>معلومات العقد الأساسية</h3><div class="pad">${infoGrid(c)}</div></div>`;
  if(c.empty){ return h+`<div class="card"><div class="empty">📄 ${c.empty}</div></div>`; }
  if(c.exec){
    const e=c.exec, p=Math.round(e.done*100/e.total), pt=e.target?Math.round(e.done*100/e.target):null, pa=e.avail?Math.round(e.done*100/e.avail):null;
    h+=`<div class="card"><h3>مؤشرات التنفيذ<small>${e.note}</small></h3><div class="pad prog">
      <div class="ring" style="--p:${pt??p}"><div><span>${pt??p}%</span><small>${pt!=null?'من المستهدف':'من العقد'}</small></div></div>
      <div class="bars">
        <div class="row"><div class="lb"><span>من إجمالي العقد</span><b>${fmt(e.done)} من ${fmt(e.total)} · ${p}%</b></div><div class="track"><span style="width:${Math.max(p,e.done?1:0)}%;background:var(--green)"></span></div></div>
        ${pt!=null?`<div class="row"><div class="lb"><span>من مستهدف التركيب</span><b>${fmt(e.done)} من ${fmt(e.target)} · ${pt}%</b></div><div class="track"><span style="width:${pt}%;background:var(--gold)"></span></div></div>`:''}
        ${pa!=null?`<div class="row"><div class="lb"><span>من المواقع المتاحة للتنفيذ</span><b>${fmt(e.done)} من ${fmt(e.avail)} · ${pa}%</b></div><div class="track"><span style="width:${pa}%;background:var(--teal)"></span></div></div>`:''}
      </div></div></div>`;
  }
  if(c.sites){
    const today=new Date().toISOString().slice(0,10), exp=s=>{const m=(s[8]||'').match(/\((\d\d)\/(\d\d)\/(\d{4})\)/);return m?`${m[3]}-${m[2]}-${m[1]}`<today:false;};
    const inst=c.sites.filter(s=>s[9]==='inst').length;
    h+=`<div class="card"><h3>مواقع العقد ورخص التركيب<small>${inst} من ${c.sites.length} مبانٍ تم التركيب عليها · المصدر: رخص اللوحات الإعلانية — أمانة المنطقة الشرقية</small></h3><div style="overflow:auto"><table><thead><tr><th>الموقع</th><th>البلدية</th><th>موقع التركيب</th><th>رقم الرخصة</th><th>الارتفاع × العرض</th><th>المساحة م²</th><th>الرسوم (ريال)</th><th>تاريخ الإصدار</th><th>صلاحية الرخصة حتى</th><th>الحالة</th></tr></thead><tbody>${c.sites.map(s=>`<tr><td><b style="color:#fff">${s[0]}</b></td><td>${s[1]}</td><td>${s[2]}</td><td class="mono">${s[3]}</td><td>${s[4]}</td><td>${s[5]}</td><td>${s[6]}</td><td>${s[7]}</td><td>${s[8]}${exp(s)?'<br><span class="st s-hold" style="margin-top:4px">منتهية — تحتاج تجديد</span>':''}</td><td>${s[9]==='inst'?'<span class="st s-done">تم التركيب</span>':'<span class="st s-wait">لم يُركّب</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  if(now) h+=`<div class="card"><h3>الموقف الحالي</h3><ul class="bl">${now.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  if(steps) h+=stepsCard(steps);
  if(next) h+=`<div class="card"><h3>الخطوة القادمة</h3><div class="next" style="margin-top:14px"><b>← التالي:</b><span>${next}</span></div></div>`;
  if(c.types) h+=`<div class="card"><h3>ملخص خطة التركيب والحفر حسب النوع</h3>${table(c.types)}<div class="tnote">ملاحظة: ${c.types.note}</div></div>`;
  if(c.plan){
    let cum=c.plan.base;
    h+=`<div class="card"><h3>${c.plan.title}<small>المنفَّذ حتى تاريخه ${c.plan.base}</small></h3><div class="months">`+c.plan.m.map(m=>{cum+=m[1];const p=Math.round(cum*100/c.plan.total);return `<div class="mo"><div class="m">${m[0]}</div><div class="c">${fmt(cum)} <small>من ${fmt(c.plan.total)}</small></div><div class="a">خلال الشهر: <b>${m[1]}</b> موقعاً · ${p}%</div><div class="track"><span style="width:${p}%;background:var(--gold)"></span></div></div>`}).join('')+`</div></div>`;
  }
  if(c.stages) h+=`<div class="card"><h3>مراحل تنفيذ المواقع الإعلانية<small>تسليم المواقع أولاً ثم ست مراحل متداخلة</small></h3><div class="stg">${STAGES.map(s=>`<div><i>${s[0]}</i><b>${s[1]}</b><span>${s[2]}</span></div>`).join('')}</div><div class="warn"><b>تنبيه مهم:</b> ${LICENSE_WARN}</div></div>`;
  if(c.bridge){
    const b=c.bridge;
    h+=`<div class="card"><h3>${b.title}<small>جسر القرية العالمية والجسر الثاني</small></h3>
      <ol class="steps">${b.items.map(it=>`<li style="--c:${SC[it[2]]}"><div class="t">${it[0]} ${chip(it[2])}</div><div class="d">${it[1]}</div></li>`).join('')}</ol>
      <div class="specs">${b.specs.map(x=>`<div class="ib"><div class="k">${x[0]}</div><div class="v" style="font-size:14.5px">${x[1]}</div></div>`).join('')}</div>
      <ul class="bl" style="padding-top:0">${b.ops.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  }
  if(c.fin){
    const f=c.fin;
    h+=`<div class="card"><h3>الموقف المالي والاستحقاقات</h3>
      ${f.intro?`<div class="pad" style="padding-bottom:0;color:var(--ink2)">${f.intro}</div>`:''}
      ${f.kpis?`<div class="fk">${f.kpis.map(k=>`<div class="ib"><div class="k">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('')}</div>`:''}
      ${f.items?`<ul class="bl">${f.items.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
      ${(f.tables||[]).map(t=>`<div style="padding:6px 18px 4px;font-weight:800;color:var(--gl)">${t.t}</div>${table(t)}`).join('<div style="height:10px"></div>')}
      ${f.impact?`<div class="imp"><div class="v">${fmt(f.impact[1])}</div><div class="k">ريال · ${f.impact[0]}</div></div>`:'<div style="height:12px"></div>'}
    </div>`;
  }
  if(c.dash&&!inIframe) h+=`<div class="card"><h3>لوحات المعلومات المرتبطة</h3><div class="links">${c.dash.map((d,i)=>`<a class="${i?'sec':''}" href="${d[1]}" target="${/^https?:/.test(d[1])?'_blank':'_self'}">${d[0]} ↗</a>`).join('')}</div></div>`;
  return h;
}
function portfolio(){
  const vals=C.map(valOf).filter(Boolean), tot=vals.reduce((a,b)=>a+b,0);
  const cnt={};C.forEach(c=>cnt[c.status[1]]=(cnt[c.status[1]]||0)+1);
  let h=`<div class="card hero"><span class="eyebrow">المحفظة الاستثمارية · ${C.length} عقداً في ${REGIONS.length} مناطق</span><h2>نظرة عامة على عقود المحفظة</h2>
   <p class="full">اختر أي عقد من القائمة لعرض معلوماته الأساسية وموقفه الحالي والإجراءات التي نتابعها.</p>
   <div class="badges">${Object.entries(cnt).map(([k,v])=>`<span class="badge">${ST[k]} <b>${v}</b></span>`).join('')}</div></div>
   <div class="card"><h3>المؤشرات المالية للمحفظة</h3><div class="pad"><div class="igrid">
    <div class="ib"><div class="k">عدد العقود</div><div class="v">${C.length}</div></div>
    <div class="ib"><div class="k">إجمالي قيم العقود المسجّلة (${vals.length} عقود)</div><div class="v">${mr(tot)}</div></div>
    <div class="ib"><div class="k">إجمالي استحقاقات عام 2026</div><div class="v">${fmt(PORT.dues2026)}</div><div class="h">ريال</div></div>
    <div class="ib"><div class="k">إجمالي الأثر المالي المستهدف</div><div class="v" style="color:#7ee5aa">${fmt(PORT.impactTotal)}</div><div class="h">ريال · ترحيلات وتعويضات</div></div>
   </div></div></div>
   <div class="card"><h3>سجل العقود<small>اضغط على أي عقد لعرض بطاقته</small></h3><div style="overflow:auto"><table><thead><tr><th>المنطقة</th><th>العقد</th><th>رقم العقد</th><th>الجهة المتعاقدة</th><th>تاريخ الاستلام</th><th>قيمة العقد (ريال)</th><th>الحالة</th></tr></thead><tbody>`+
   C.map(c=>{const rc=(c.info||[]).find(x=>x[0]==='تاريخ الاستلام');const v=valOf(c);return `<tr class="go" data-id="${c.id}"><td>${regAr(c.region)}</td><td><b style="color:#fff">${c.short}</b></td><td class="mono">${c.no}</td><td>${c.party}</td><td class="mono">${rc?rc[1]:'—'}</td><td>${v?fmt(v):'—'}</td><td>${chip(c.status[1],c.status[0])}</td></tr>`}).join('')+
   `</tbody><tfoot><tr><td colspan="5">الإجمالي</td><td>${fmt(tot)}</td><td></td></tr></tfoot></table></div></div>
   <div class="card"><h3>الأثر المالي المستهدف من الترحيلات والتعويضات</h3><div style="overflow:auto"><table><thead><tr><th>البيان</th><th>المبلغ (ريال)</th><th>العقد</th></tr></thead><tbody>`+
   PORT.impacts.map(i=>`<tr class="go" data-id="${i[2]}"><td>${i[0]}</td><td>${fmt(i[1])}</td><td class="mono">${i[2]}</td></tr>`).join('')+
   `</tbody><tfoot><tr><td>إجمالي الأثر المالي المستهدف</td><td>${fmt(PORT.impactTotal)}</td><td></td></tr></tfoot></table></div><div class="tnote">إجمالي استحقاقات عام 2026 حسب الكشوفات: ${fmt(PORT.dues2026)} ريال.</div></div>`;
  return h;
}
function go(id,noPush){
  if(id!=='portfolio'&&!C.find(c=>c.id===id)) id='portfolio';
  nav(id);
  document.body.classList.toggle('single', id!=='portfolio');
  const m=$('#main'); m.style.animation='none'; void m.offsetWidth; m.style.animation='';
  m.innerHTML = id==='portfolio'?portfolio():contract(C.find(c=>c.id===id));
  m.querySelectorAll('tr.go').forEach(r=>r.onclick=()=>go(r.dataset.id));
  
  window.scrollTo({top:0,behavior:'smooth'});
}
go('CN-37100',true);
</script>
